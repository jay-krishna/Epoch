<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0C110E" media="(prefers-color-scheme: dark)" />
<title>Epoch</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="application-name" content="Epoch" />
  <meta name="apple-mobile-web-app-title" content="Epoch" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Quicksand:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F3F7F4;
    --text:#16201C; --muted:#75857D; --border:#DBE3DE;
    --accent:#0E9F6E; --accent-ink:#FFFFFF; --accent-soft:rgba(14,159,110,.12);
    --track:#DEE6E1; --danger:#E14B50;
    --shadow:0 18px 50px -24px rgba(20,60,45,.42);
    --shadow-sm:0 6px 20px -12px rgba(20,60,45,.32);
    --glow:rgba(14,159,110,.28);
  }
  [data-theme="dark"]{
    --bg:#0C110E; --surface:#141A16; --surface-2:#1B221D;
    --text:#E9F0EC; --muted:#7E8B84; --border:#232B26;
    --accent:#34D399; --accent-ink:#08110C; --accent-soft:rgba(52,211,153,.16);
    --track:#232B26; --danger:#FF6369;
    --shadow:0 24px 60px -30px rgba(0,0,0,.7);
    --shadow-sm:0 8px 24px -14px rgba(0,0,0,.6);
    --glow:rgba(52,211,153,.30);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    transition:background .4s ease,color .4s ease;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:
      calc(env(safe-area-inset-top) + 4px)
      calc(env(safe-area-inset-right) + 18px)
      calc(env(safe-area-inset-bottom) + 14px)
      calc(env(safe-area-inset-left) + 18px);
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:8px 2px;
  }
  .brand{display:flex;align-items:center;gap:11px;user-select:none}
  .brand-badge{
    width:36px;height:36px;border-radius:11px;
    background:var(--accent);
    display:grid;place-items:center;
    box-shadow:var(--shadow-sm);
    transition:background .3s ease;
  }
  .brand-badge svg{display:block;color:var(--accent-ink)}
  .brand-name{
    font-family:"Quicksand",system-ui,sans-serif;
    font-weight:600;
    font-size:1.34rem;
    letter-spacing:.045em;
    line-height:1;
  }
  .actions{display:flex;align-items:flex-start;gap:10px}
  .tools{display:flex;flex-direction:column;gap:9px}

  .icon-btn{
    width:46px;height:46px;border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    display:grid;place-items:center;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .16s ease,background .25s ease,border-color .25s ease,color .25s ease;
    touch-action:manipulation;
  }
  .icon-btn svg{width:20px;height:20px}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .icon-btn:disabled{
    opacity:.35;cursor:not-allowed;box-shadow:none;
  }
  .icon-btn:disabled:active{transform:none}
  @keyframes micPulse{
    0%{box-shadow:0 0 0 0 var(--glow)}
    70%{box-shadow:0 0 0 11px transparent}
    100%{box-shadow:0 0 0 0 transparent}
  }
  .icon-btn.listening{animation:micPulse 1.7s ease-out infinite}
  @media(hover:hover){
    .icon-btn:not(.active):hover{border-color:var(--accent);color:var(--accent)}
  }
  .icon-btn:focus-visible,
  .btn:focus-visible,.digit-input:focus-visible{
    outline:2px solid var(--accent);outline-offset:3px;
  }

  /* ---------- toast ---------- */
  .toast-wrap{
    position:fixed;left:0;right:0;
    top:calc(env(safe-area-inset-top) + 76px);
    display:flex;justify-content:center;
    padding:0 16px;z-index:60;pointer-events:none;
  }
  .toast{
    background:var(--surface);color:var(--text);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    border-radius:14px;
    padding:12px 16px;
    font-size:.94rem;font-weight:500;line-height:1.35;
    max-width:min(92vw,430px);
    text-align:center;
    opacity:0;transform:translateY(-12px) scale(.98);
    transition:opacity .25s ease,transform .25s ease;
  }
  .toast.show{opacity:1;transform:none}
  .toast.err{border-color:var(--danger)}

  /* ---------- debug console ---------- */
  .console{
    border-top:1px solid var(--border);
    background:var(--surface);
    transition:background .4s ease,border-color .4s ease;
    flex:0 0 auto;
  }
  .console-head{
    display:flex;align-items:center;gap:10px;
    padding:11px 16px;cursor:pointer;user-select:none;
  }
  .console-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--muted);flex:0 0 auto;
    transition:background .25s ease;
  }
  .console.live .console-dot{
    background:var(--accent);
    animation:micPulse 1.7s ease-out infinite;
  }
  .console-title{
    flex:1 1 auto;
    font-family:"Hanken Grotesk",sans-serif;
    font-weight:600;font-size:.9rem;color:var(--text);
  }
  .console-clear{
    font-family:"Hanken Grotesk",sans-serif;
    font-size:.8rem;font-weight:600;color:var(--muted);
    background:transparent;border:0;cursor:pointer;
    padding:5px 8px;border-radius:8px;
  }
  @media(hover:hover){ .console-clear:hover{color:var(--accent)} }
  .console-chev{width:18px;height:18px;color:var(--muted);flex:0 0 auto;transition:transform .25s ease}
  .console.open .console-chev{transform:rotate(180deg)}
  .console-log{
    max-height:0;overflow:hidden;
    transition:max-height .28s ease;
    padding:0 16px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.78rem;line-height:1.55;
  }
  .console.open .console-log{
    max-height:min(38vh,320px);
    overflow-y:auto;
    padding:2px 16px 14px;
    -webkit-overflow-scrolling:touch;
  }
  .log-line{color:var(--text);white-space:pre-wrap;word-break:break-word}
  .log-time{color:var(--muted)}
  .log-sys{color:var(--muted)}
  .log-interim{color:var(--muted);font-style:italic}
  .log-heard{color:var(--text)}
  .log-cmd{color:var(--accent)}
  .log-err{color:var(--danger)}
  .console.hidden{display:none}

  [data-theme="light"] .i-moon{display:none}
  [data-theme="dark"] .i-sun{display:none}
  [data-mode="countdown"] .i-countup{display:none}
  [data-mode="countup"] .i-countdown{display:none}

  .left-group{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
  #modeBtn{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }

  .interval-row{display:flex;align-items:center;gap:6px}
  body:not([data-mode="countup"]) .interval-row{display:none}
  .pill-btn{
    font-family:"Hanken Grotesk",sans-serif;
    font-weight:600;
    font-size:.78rem;
    letter-spacing:.02em;
    white-space:nowrap;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    border-radius:999px;
    padding:6px 13px;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .16s ease,background .2s ease,border-color .2s ease,color .2s ease;
    touch-action:manipulation;
  }
  .pill-btn:active{transform:scale(.94)}
  .pill-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  @media(hover:hover){
    .pill-btn:not(.active):hover{border-color:var(--accent);color:var(--accent)}
  }
  .interval-drawer{
    display:flex;align-items:center;gap:6px;
    max-width:0;overflow:hidden;opacity:0;
    transition:max-width .3s ease,opacity .2s ease;
  }
  .interval-drawer.open{max-width:300px;opacity:1}

  /* ---------- Main / timer face ---------- */
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  .stage{
    position:relative;
    display:grid;
    place-items:center;
  }
  .glow{
    position:absolute;inset:-14%;
    border-radius:50%;
    background:radial-gradient(circle at 50% 46%,var(--glow),transparent 62%);
    opacity:0;
    transition:opacity .6s ease;
    pointer-events:none;
  }
  .stage.is-running .glow{opacity:1}

  .face{
    --size:max(238px, min(80vw, 54vh, 440px));
    width:var(--size);height:var(--size);
    position:relative;
    display:grid;place-items:center;
  }
  .ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring-track{
    fill:none;stroke:var(--track);stroke-width:5;
    transition:stroke .4s ease;
  }
  .ring-progress{
    fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;
    transition:stroke-dashoffset .35s cubic-bezier(.4,0,.2,1),stroke .4s ease;
  }
  .ring-progress.no-anim{transition:stroke .4s ease}

  .dial{
    position:absolute;inset:0;
    display:grid;place-items:center;
    padding:0 6%;
  }
  .time{
    display:grid;
    grid-template-columns:auto auto auto auto auto;
    grid-template-rows:auto auto;
    align-items:center;
    justify-items:center;
    column-gap:.04em;
  }
  .digit-input{
    grid-row:1;
    width:2ch;
    border:0;background:transparent;
    font-family:"Sora",sans-serif;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    font-size:clamp(2.05rem,11vw,3.55rem);
    line-height:1;
    letter-spacing:-.02em;
    color:var(--text);
    text-align:center;
    padding:0;margin:0;
    caret-color:var(--accent);
    border-radius:10px;
    transition:color .2s ease,background .2s ease;
  }
  .digit-input::placeholder{color:var(--muted);opacity:.45}
  .digit-input:focus{outline:none;background:var(--accent-soft)}
  .digit-input:read-only{cursor:default}
  .colon{
    grid-row:1;
    font-family:"Sora",sans-serif;font-weight:500;
    font-size:clamp(1.9rem,10vw,3.3rem);
    line-height:1;color:var(--muted);
    transform:translateY(-.04em);
    padding:0 .02em;
  }
  .lbl{
    grid-row:2;
    margin-top:.55em;
    font-size:clamp(.66rem,2.7vw,.8rem);
    font-weight:500;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .face.finished .digit-input{color:var(--accent)}
  @keyframes pulse{
    0%{transform:scale(1)}
    35%{transform:scale(1.035)}
    100%{transform:scale(1)}
  }
  .face.finished{animation:pulse .7s ease 2}

  /* ---------- Footer / controls ---------- */
  footer{
    display:flex;
    justify-content:center;
    padding:10px 0 2px;
  }
  .controls{width:100%;max-width:440px}
  .btn{
    font-family:"Hanken Grotesk",sans-serif;
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:.01em;
    border:1px solid transparent;
    border-radius:18px;
    padding:17px 20px;
    cursor:pointer;
    transition:transform .16s ease,background .25s ease,opacity .25s ease,border-color .25s ease,color .25s ease;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }
  .btn:active{transform:scale(.975)}
  .btn-primary{
    width:100%;
    background:var(--accent);color:var(--accent-ink);
    box-shadow:0 14px 30px -16px var(--glow);
  }
  .btn-primary:disabled{
    background:var(--surface-2);color:var(--muted);
    box-shadow:none;cursor:not-allowed;opacity:1;
    border-color:var(--border);
  }
  .run{display:none;gap:12px}
  .run .btn{flex:1}
  .btn-ghost{
    background:var(--accent);color:var(--accent-ink);
  }
  .btn-stop{
    background:var(--surface);color:var(--text);
    border-color:var(--border);box-shadow:var(--shadow-sm);
  }
  @media(hover:hover){
    .btn-stop:hover{border-color:var(--danger);color:var(--danger)}
  }

  body[data-state="running"] #startBtn,
  body[data-state="paused"] #startBtn{display:none}
  body[data-state="running"] .run,
  body[data-state="paused"] .run{display:flex}

  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001ms !important;animation:none !important}
  }
</style>
<script>
  (function(){
    try{
      var t = localStorage.getItem("epoch-theme");
      if(!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    }catch(e){}
  })();
</script>
</head>
<body data-state="idle" data-mode="countdown">

  <div class="toast-wrap" id="toastWrap" aria-live="polite" role="status"></div>

  <header>
    <div class="left-group">
      <div class="brand">
        <span class="brand-badge">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="12" cy="3" r="1.9" fill="currentColor"/>
            <path d="M12 12l3.4 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-name">Epoch</span>
      </div>
      <button class="icon-btn" id="modeBtn" aria-pressed="false" aria-label="Switch to stopwatch mode" title="Timer mode">
        <svg class="i-countdown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 2h14M5 22h14M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/>
        </svg>
        <svg class="i-countup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="14" r="8"/>
          <path d="M12 10v4l3 2M9 2h6"/>
        </svg>
      </button>
      <div class="interval-row" id="intervalRow">
        <button class="pill-btn" id="intervalBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Beep interval" title="Beep interval">10s</button>
        <div class="interval-drawer" id="intervalDrawer">
          <button class="pill-btn interval-option" type="button" data-sec="5">5s</button>
          <button class="pill-btn interval-option" type="button" data-sec="10">10s</button>
          <button class="pill-btn interval-option" type="button" data-sec="30">30s</button>
          <button class="pill-btn interval-option" type="button" data-sec="60">60s</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/>
        </svg>
      </button>

      <div class="tools">
        <button class="icon-btn" id="micBtn" aria-pressed="false" aria-label="Voice control" title="Voice control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0"/>
            <path d="M12 18v3"/>
          </svg>
        </button>
        <button class="icon-btn" id="wakeBtn" aria-pressed="false" aria-label="Keep screen awake" title="Keep screen awake">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/>
            <path d="M17 9h2.4a2.5 2.5 0 0 1 0 5H17"/>
            <path d="M8 2.6c-.5.8-.5 1.6 0 2.4M12 2.6c-.5.8-.5 1.6 0 2.4"/>
          </svg>
        </button>
        <button class="icon-btn" id="logBtn" aria-pressed="false" aria-label="Show voice log" title="Show voice log">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M4 12h11M4 18h14"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="glow"></div>
      <div class="face" id="face">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="90"/>
          <circle class="ring-progress" id="progress" cx="100" cy="100" r="90"/>
        </svg>
        <div class="dial">
          <div class="time">
            <input class="digit-input" id="hh" style="grid-column:1" inputmode="numeric" enterkeyhint="done"
                   maxlength="2" value="00" placeholder="00" aria-label="Hours" autocomplete="off" spellcheck="false"/>
            <span class="colon" style="grid-column:2" aria-hidden="true">:</span>
            <input class="digit-input" id="mm" style="grid-column:3" inputmode="numeric" enterkeyhint="done"
                   maxlength="2" value="00" placeholder="00" aria-label="Minutes" autocomplete="off" spellcheck="false"/>
            <span class="colon" style="grid-column:4" aria-hidden="true">:</span>
            <input class="digit-input" id="ss" style="grid-column:5" inputmode="numeric" enterkeyhint="done"
                   maxlength="2" value="00" placeholder="00" aria-label="Seconds" autocomplete="off" spellcheck="false"/>
            <span class="lbl" style="grid-column:1">hh</span>
            <span class="lbl" style="grid-column:3">mm</span>
            <span class="lbl" style="grid-column:5">ss</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="controls">
      <button class="btn btn-primary" id="startBtn" disabled>Start</button>
      <div class="run">
        <button class="btn btn-ghost" id="pauseBtn">Pause</button>
        <button class="btn btn-stop" id="stopBtn">Stop</button>
      </div>
    </div>
  </footer>

  <section class="console hidden" id="console">
    <div class="console-head" id="consoleHead">
      <span class="console-dot"></span>
      <span class="console-title">Voice log</span>
      <button class="console-clear" id="consoleClear" type="button">Clear</button>
      <svg class="console-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
    </div>
    <div class="console-log" id="consoleLog"></div>
  </section>

<script>
(function(){
  "use strict";

  const hh = document.getElementById("hh");
  const mm = document.getElementById("mm");
  const ss = document.getElementById("ss");
  const inputs = [
    {el:hh, max:99},
    {el:mm, max:59},
    {el:ss, max:59}
  ];
  const startBtn = document.getElementById("startBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const stopBtn  = document.getElementById("stopBtn");
  const modeBtn  = document.getElementById("modeBtn");
  const intervalBtn     = document.getElementById("intervalBtn");
  const intervalDrawer  = document.getElementById("intervalDrawer");
  const intervalOptions = Array.from(intervalDrawer.querySelectorAll(".interval-option"));
  const progress = document.getElementById("progress");
  const stage    = document.getElementById("stage");
  const face     = document.getElementById("face");
  const body     = document.body;

  const R = progress.r.baseVal.value;
  const C = 2 * Math.PI * R;
  progress.style.strokeDasharray = C;
  progress.style.strokeDashoffset = C; // empty

  let mode    = "countdown";      // countdown | countup
  let state   = "idle";           // idle | running | paused
  let totalMs = 0;
  let endTime = 0;
  let leftMs  = 0;                // remaining while paused (countdown)
  let startTime = 0;              // origin instant for the count-up clock
  let elapsedMs = 0;              // elapsed while paused (count-up)
  let beepIntervalSec = 10;       // stopwatch beep cadence
  let rafId   = null;
  let lastShownSec = 0;           // last whole second rendered

  /* ---------- helpers ---------- */
  function clampInt(str, max){
    let n = parseInt(str, 10);
    if (isNaN(n) || n < 0) n = 0;
    if (n > max) n = max;
    return n;
  }
  function inputSeconds(){
    return clampInt(hh.value,99)*3600 + clampInt(mm.value,59)*60 + clampInt(ss.value,59);

  function pad(n){ return String(n).padStart(2,"0"); }

  function refreshStart(){

  function setReadonly(ro){

  function setAppState(next){          // idle | running | paused

  function setIntervalDrawer(open){

  function setBeepInterval(sec){

  function setMode(next){

    modeBtn.setAttribute("aria-label", mode === "countup" ? "Switch to timer mode" : "Switch to stopwatch mode");

    writeDigits(0);
    setRing(0);

  /* ---------- input handling ---------- */
  inputs.forEach(({el, max}) => {

    el.addEventListener("blur", () => {

  /* ---------- timer engine ---------- */
  function tick(){
    const now = performance.now();

      setRing(totalMs > 0 ? remaining / totalMs : 0);
      const secs = Math.ceil(remaining / 1000);
      if (secs !== lastShownSec){
        lastShownSec = secs;
        writeDigits(secs);
        if (secs >= 1 && secs <= 5) playTick();   // final 5-second countdown
      }
      if (remaining <= 0){ finish(); return; }
    } else { // countup: ring stays fully lit (set once in start/resume)
      const secs = Math.floor((now - startTime) / 1000);
      if (secs !== lastShownSec){

        writeDigits(secs);
        if (secs > 0 && secs % beepIntervalSec === 0) playBeep();   // stopwatch cadence

  function start(){

      if (inputSeconds() === 0) return;
      totalMs = inputSeconds() * 1000;

      endTime = performance.now() + totalMs;
    } else {
      lastShownSec = 0;
      writeDigits(0);
      startTime = performance.now();
    }

    stage.classList.add("is-running");
    progress.classList.add("no-anim");
    face.classList.remove("finished");

    rafId = requestAnimationFrame(tick);

  function resume(){

      lastShownSec = Math.ceil(leftMs / 1000);

      lastShownSec = Math.floor(elapsedMs / 1000);
    }
    setAppState("running");
    stage.classList.add("is-running");

    playStart();
    acquireWake();
    rafId = requestAnimationFrame(tick);
  }

  function reset(){ // back to idle, default 00:00:00
    cancelAnimationFrame(rafId);
    setAppState("idle");
    stage.classList.remove("is-running");
    face.classList.remove("finished");

    setReadonly(mode === "countup");   // count-up display stays read-only

    refreshStart();

  function finish(){
    cancelAnimationFrame(rafId);

  /* ---------- audio ---------- */
  let audioCtx = null;
  function getCtx(){

  function tone(freq, dur, delay, vol, type){
    const ctx = getCtx(); if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + (delay || 0);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol == null ? 0.15 : vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0006, t + dur);

  }

    tone(830.61, 0.50, 0.16, 0.16, "sine");   // G#5
    tone(987.77, 0.55, 0.32, 0.16, "sine");   // B5

  /* ---------- toast ---------- */
  const toastWrap = document.getElementById("toastWrap");

  function fmtDur(sec){

    if (s || p.length === 0) p.push(s + "s");
    return p.join(" ");
  }

  const ONES = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
    eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};

  function wordsToDigits(str){
    const t = str.split(/\s+/), out = [];
    for (let i = 0; i < t.length; i++){
      const w = t[i];
      if (w === "a" || w === "an"){ out.push("1"); continue; }
      if (TENS[w] != null){
        let v = TENS[w];
        if (t[i+1] != null && ONES[t[i+1]] != null && ONES[t[i+1]] < 10){ v += ONES[t[i+1]]; i++; }
        out.push(String(v)); continue;

      if (ONES[w] != null){ out.push(String(ONES[w])); continue; }

  function handleCommand(cmd){

        if (mode === "countdown"){ logLine("switch ignored (already timer)", "sys"); showToast("Already in timer mode"); return; }
        if (state !== "idle"){ logLine("switch ignored (timer active)", "sys"); showToast("Stop the timer before switching modes"); return; }
        logLine("\u2192 switch to timer", "cmd"); setMode("countdown");
        return;
      }
      logLine("switch command not understood", "err");
      showToast("Say \u201cEpoch switch timer\u201d or \u201cEpoch switch stopwatch\u201d");
      return;
    }
    if (/\b(stop|reset|cancel)\b/.test(cmd)){
      logLine("\u2192 stop", "cmd"); reset(); showToast("Timer stopped"); return;
    }
    if (/\b(pause|pasue|paws|hold)\b/.test(cmd)){
      if (state === "running"){ logLine("\u2192 pause", "cmd"); pause(); showToast("Paused"); }
      else logLine("pause ignored (not running)", "sys");
      return;
    }
    if (/\b(resume|continue|unpause)\b/.test(cmd)){
      if (state === "paused"){ logLine("\u2192 resume", "cmd"); resume(); showToast("Resumed"); }
      else logLine("resume ignored (not paused)", "sys");
      return;
    }
    if (/\b(start|begin|go)\b/.test(cmd)){
      if (state === "paused"){ logLine("\u2192 resume", "cmd"); resume(); showToast("Resumed"); return; }
      if (state === "running"){ logLine("start ignored (already running)", "sys"); showToast("Already running"); return; }
      if (mode === "countup"){ logLine("\u2192 start (stopwatch)", "cmd"); start(); return; }
      const dur = parseDuration(cmd);
      if (dur && dur > 0){ logLine("\u2192 set " + fmtDur(dur) + " + start", "cmd"); setTime(dur); }

      if (inputSeconds() > 0){ start(); showToast("Started \u00b7 " + fmtDur(inputSeconds())); }

    }
    if (/\bset\b/.test(cmd)){
      if (mode === "countup"){ logLine("set ignored (stopwatch has no fixed duration)", "sys"); showToast("Stopwatch starts from 00:00:00 \u2014 switch to timer mode to set a time"); return; }
      if (state !== "idle"){ logLine("set ignored (timer active)", "sys"); showToast("Stop the timer before setting a new one"); return; }
      const dur = parseDuration(cmd);
      if (dur && dur > 0){ logLine("\u2192 set " + fmtDur(dur), "cmd"); setTime(dur); showToast("Set \u00b7 " + fmtDur(dur)); }

      return;
    }
    logLine("unrecognized command", "err");
    showToast("Didn\u2019t catch that \u2014 try \u201cstart\u201d, \u201cpause\u201d, or \u201cstop\u201d");

  const WAKE = /\b(epoch|epic|epoc|epok|epox|eppoch|hello)\b/;

        }

    };

  }

  /* ---------- controls ---------- */

  /* ---------- theme (persisted in localStorage; default = system) ---------- */

  const logBtn = document.getElementById("logBtn");

  (function envDiag(){

    logLine("page: " + location.protocol + "//" + (location.host || "(local file)"), okOrigin ? "sys" : "err");
    logLine("secure context: " + window.isSecureContext, window.isSecureContext ? "sys" : "err");
    logLine("online: " + navigator.onLine, navigator.onLine ? "sys" : "err");
    logLine("browser: " + navigator.userAgent, "sys");
    try{
      if (navigator.brave && typeof navigator.brave.isBrave === "function"){
        navigator.brave.isBrave().then(function(b){
          if (b) logLine("Brave detected \u2014 Brave disables Google\u2019s speech backend, so voice recognition can\u2019t work here. Use Google Chrome.", "err");
        }).catch(function(){});
      }
    }catch(_){}
  })();
  logLine("ready \u2014 tap the mic, allow access, then say \u201cEpoch start 30 seconds\u201d", "sys");
  if (!SR) logLine("note: SpeechRecognition not found in this browser", "err");

  /* ---------- pause the timer when the tab loses focus ---------- */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){
      if (state === "running"){ pause(); }
    } else if (state === "running"){
      acquireWake();   // re-arm a lock the browser auto-released while hidden
    }
  });

  refreshStart();
})();
</script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js").catch(function () {});
      });
    }
  </script>
